<!DOCTYPE html>
<html>
    <head>
        <title>Game page</title>
        <link rel="stylesheet" href="../styles/global.css">
        <link rel="stylesheet" href="../styles/game.css">
        <link rel="icon" href="../Assets/Sprites/favicon.png" type="image/png">
        <script type="module" src="../../Game/Return.js" defer></script>
    </head>

    <body class="main">
        <nav class="Nav-bar">
            <a href="game.html" class="nav-logo"><img src="../Assets/Sprites/logoGrande.png" alt="Return"></a>
            <ul>
                <a href="index.html" class="Nav-Button">
                    <li>Home</li>
                </a>
                <a href="login.html" class="Nav-Button">
                    <li>Game</li>
                </a>
                <a href="tutorial.html" class="Nav-Button">
                    <li>Tutorial</li>
                </a>
                <a href="madeby.html" class="Nav-Button">
                    <li>Made by</li>
                </a>
            </ul>
        </nav>
        <div class="Canva-container">
            <canvas id="canvas"></canvas>
        </div>
        <div id="lobby-container" style="display:none"></div>

        <!-- Battle Tutorial Overlay -->
        <div id="battle-tutorial-overlay" class="battle-tutorial-overlay hidden">
            <div class="battle-tutorial-modal">
                <div class="battle-tutorial-header">
                    <h2>Battle Tutorial</h2>
                    <span id="battle-tutorial-counter" class="battle-tutorial-counter">1 / 5</span>
                </div>
                <div class="battle-tutorial-body">
                    <button class="battle-tutorial-nav battle-tutorial-prev" aria-label="Previous">&#10094;</button>
                    <div class="battle-tutorial-slide">
                        <div class="battle-tutorial-image-box">
                            <img id="battle-tutorial-img" src="" alt="">
                        </div>
                        <div class="battle-tutorial-text">
                            <h3 id="battle-tutorial-title"></h3>
                            <p id="battle-tutorial-desc"></p>
                        </div>
                    </div>
                    <button class="battle-tutorial-nav battle-tutorial-next" aria-label="Next">&#10095;</button>
                </div>
                <div class="battle-tutorial-dots" id="battle-tutorial-dots"></div>
                <div class="battle-tutorial-footer">
                    <label class="battle-tutorial-checkbox">
                        <input type="checkbox" id="battle-tutorial-skip">
                        <span>Don't show again</span>
                    </label>
                    <button class="battle-tutorial-quit" id="battle-tutorial-quit">Quit Tutorial</button>
                </div>
            </div>
        </div>
    </body>
</html>
